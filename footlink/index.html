<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Hamburguesas, pizza y postres hechos para antojarse antes del primer bocado." />
  <meta name="theme-color" content="#181512" />
  <title>FOODLINK — Cocina con carácter</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body class="antialiased selection:bg-brand-4 selection:text-white" data-section="hero">
  
  <!-- UI Container -->
  <main class="relative z-20 w-full overflow-hidden" id="app">
    
    <!-- Navbar will be injected here -->
    <div id="navbar-root"></div>

    <!-- Hero Section (Burger) -->
    <section id="hero-root" class="relative w-full min-h-screen flex items-center"></section>
    
    <!-- Editorial Section (Pizza) -->
    <section id="features-root" class="relative w-full min-h-screen flex items-center py-20"></section>
    
    <!-- Final Product Section (Donut) -->
    <section id="menu-root" class="relative w-full min-h-screen flex items-center py-20"></section>

    <!-- Footer / Final CTA -->
    <section id="footer-root" class="relative w-full py-20"></section>
    
  </main>

  <!-- Login Modal Root -->
  <div id="login-modal-root"></div>

  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
